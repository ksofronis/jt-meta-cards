name: bf26-cards
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bf26
  cancel-in-progress: false
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq fonts-liberation >/dev/null && pip install -q pillow numpy boto3
      - run: python3 bf26_cards.py render ${{ matrix.shard }} 8
  feed:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq fonts-liberation >/dev/null && pip install -q pillow numpy boto3
      - run: python3 bf26_cards.py feed 8
