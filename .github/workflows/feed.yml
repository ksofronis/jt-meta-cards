name: meta-feed
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: meta-feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 feed_rewrite.py
      - run: python3 release.py
      - run: python3 supp_build.py
      - run: |
          git config user.name "jt-feed-bot"
          git config user.email "jt-feed-bot@users.noreply.github.com"
          git add feed/facebook.xml feed/supplementary.csv supp_count.txt
          [ -e PAUSE ] || git rm -q --cached --ignore-unmatch PAUSE
          git diff --cached --quiet || (git commit -m "feed refresh" && git push)
  # GitHub's cron is unreliable on new repos: while the rollout is incomplete, re-trigger this workflow after ~55 min.
  next:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          n=$(cat supp_count.txt); t=$(grep -c . supp_order.txt)
          if [ "$n" -lt "$t" ]; then
            # wake exactly at release time if it falls inside the normal 55-min wait
            r=$(date -d 2026-10-09T20:55:30Z +%s); now=$(date +%s); w=3300
            if [ $((r-now)) -gt 0 ] && [ $((r-now)) -lt 3300 ]; then w=$((r-now)); fi
            sleep $w
            curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/feed.yml/dispatches -d '{"ref":"main"}'
          fi
