name: card-preview
on:
  workflow_dispatch:
    inputs:
      ids:
        description: product ids (space separated)
        required: true
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq fonts-liberation >/dev/null && pip install -q pillow
      - run: python3 auto_cards.py --preview ${{ github.event.inputs.ids }}
      - run: |
          git config user.name "jt-feed-bot"; git config user.email "jt-feed-bot@users.noreply.github.com"
          git add preview && git commit -m "card preview" && git pull --rebase && git push
